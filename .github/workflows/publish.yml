name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test

      # Two ways to release from CI:
      #  - trusted publishing: configure this repository + workflow as a trusted
      #    publisher of the package on npmjs, then no token is needed (id-token).
      #  - NPM_TOKEN secret: an npm automation or granular token with publish
      #    permission for this package.
      - name: Check publish credentials
        id: credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this version is already published
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-usage-cost@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.credentials.outputs.present == 'true' && steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip notice
        if: steps.credentials.outputs.present != 'true' || steps.published.outputs.already == 'true'
        run: |
          echo "Skipping npm publish (no NPM_TOKEN secret, or version already published)."
